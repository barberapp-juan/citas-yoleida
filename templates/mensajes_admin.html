<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensajes Admin</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="admin-body">

<div class="admin-container">

<h2 class="admin-title">Mensajes de Clientas</h2>

{% for m in mensajes %}
<div class="mensaje-card">

<b>Cliente:</b> {{ m.usuario }} <br>
<b>Mensaje:</b> {{ m.mensaje }}

<form method="POST">
    <input type="hidden" name="index" value="{{ loop.index0 }}">
    <br>
    <textarea name="respuesta" placeholder="Responder..." required></textarea>
    <br><br>
    <button class="btn verde">Responder</button>
</form>

</div>
<hr>
{% endfor %}

<a href="/admin" class="btn amarillo">Volver</a>

</div>

</body>
</html>
